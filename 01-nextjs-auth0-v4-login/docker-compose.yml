services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: auth0-01-nextjs-auth0-v4-login:01
    working_dir: /workspace/web
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/web/node_modules
      - web_next:/workspace/web/.next
    ports:
      - "3000:3000"
    environment:
      XDG_CONFIG_HOME: /home/node/.config
      HOME: /home/node
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    user: "0:0"
    # リポジトリの scripts を直接使う（normalize-env の更新を再ビルドなしで反映）
    entrypoint: ["bash", "/workspace/scripts/docker-entrypoint-web.sh"]

  lab:
    image: auth0-01-nextjs-auth0-v4-login:01
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: true
    user: "0:0"
    volumes:
      - .:/workspace
      - ./.auth0-config:/home/node/.config/auth0
      - web_node_modules:/workspace/web/node_modules
    environment:
      XDG_CONFIG_HOME: /home/node/.config
      HOME: /home/node
    profiles:
      - cli
    entrypoint: ["gosu", "node", "bash", "-lc"]
    command:
      - |
        mkdir -p /home/node/.config/auth0
        exec bash

volumes:
  web_node_modules:
  web_next:
